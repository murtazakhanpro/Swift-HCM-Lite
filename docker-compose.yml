version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: swift_hcm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: swift_hcm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swift_hcm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - face_model_cache:/root/.cache/huggingface
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/swift_hcm
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gemini-3.5-flash-lite}
      - FACE_ENCRYPTION_KEY=${FACE_ENCRYPTION_KEY}
      - FACE_MODEL_ID=${FACE_MODEL_ID:-fal/AuraFace-v1}
      - FACE_MODEL_REVISION=${FACE_MODEL_REVISION:-main}
      - FACE_MATCH_THRESHOLD=${FACE_MATCH_THRESHOLD:-0.65}
      - JWT_SECRET=${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters in .env}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swift_hcm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  face_model_cache:
